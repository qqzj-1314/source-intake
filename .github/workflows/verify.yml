name: Verify source intake

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'plugin/**'
      - 'skill/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/**'
      - '.claude-plugin/**'
      - 'bin/**'
      - 'integrations/**'
  pull_request:
    paths:
      - 'plugin/**'
      - 'skill/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/**'
      - '.claude-plugin/**'
      - 'bin/**'
      - 'integrations/**'

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.os }} / Python 3.11 / Node 22
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: plugin/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Linux Tk display dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb tk
      - name: Install locked dependencies
        run: npm --prefix plugin ci --ignore-scripts
      - name: Verify committed standalone runtime matches current source
        run: node scripts/verify-standalone.mjs
      - name: Generate local client configurations
        run: node scripts/configure.mjs --client all
      - name: Verify actual MCP connection and Python engine
        run: node plugin/doctor-launch.mjs --config plugin/.local/clients/generic.json
      - name: MCP and panel regression tests
        run: npm --prefix plugin test
      - name: Python regression tests with Linux display
        if: runner.os == 'Linux'
        run: xvfb-run -a python -B -X utf8 -m unittest discover -s tests -v
      - name: Python regression tests on Windows and macOS
        if: runner.os != 'Linux'
        run: python -B -X utf8 -m unittest discover -s tests -v
